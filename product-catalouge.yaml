          type: string
        - name: .lt
          description: "Matches values that are less than a specified value.\n\nExamples:\n/policyConstraint?lastUpdate.lt=2019-01-01T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: .lte
          description: "Matches values that are less than or equal to a specified value.\n\nExamples:\n/policyConstraint?lastUpdate.lte=2019-01-01T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: .gt
          description: "Matches values that are greater than a specified value.\n\nExamples:\n/policyConstraint?lastUpdate.gt=2019-01-01T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: .gte
          description: "Matches values that are greater than or equal to a specified value.\n\nExamples:\n/policyConstraint?lastUpdate.gte=2019-01-01T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
