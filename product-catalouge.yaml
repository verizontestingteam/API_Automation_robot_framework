        - name: sort
          description: "Sort result based on given field(s).\n\nDefault sort direction is ascending. Use '-' modifier in front of the sort field name to change direction to descending.\n\nExample: /policyConstraint?sort=lastUpdate,-@type"
          in: query
          schema:
          type: string
        - name: equality
          description: "All fields that are not special query parameters are compare directly for equality.\n\nEquality comparison can be done for all fields in depth 0 or 1.\nFor depths greater than 0 dot notation is used for field names.\n\nExamples:\n/policyConstraint?@type=PredicatePolicyConstraint\n/policyConstraint?criteriaGroup.criteriaParameter=customerSegment\n/policyConstraint?criteriaGroup.criteriaValue=PREPAID"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: q
          description: "Performs a text search on the content of the name fields.\n\nExample: /policyConstraint?q=subscription"
          in: query
