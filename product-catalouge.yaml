      type: http
      scheme: bearer
security:
- Bearer: []
servers:
- url: /dcm/product-catalogue
paths:
  "/v1/task":
    get:
      parameters:
- name: depth
          description: "The depth query parameter is used to expand inline referenced entities up to the level specified.\n\nIf depth = 0, then all referenced entities are returned as RootEntity objects which contain only ID(s)\n(may also contain href and @schemaLocation).\n\nIf depth = 1, then the first level of related target entities is expanded.\nReferences are replaced with the actual loaded entities with the corresponding level of details.\n\nIf depth = N it expands reference objects of related entities recursively.\n\nMaximum depth level is 8. Any given depth level which exceeds the maximum is set as 8.\n\nIf depth is not specified, then the default value will depend on the expand parameter.\nIf expand parameter is set, then depth is 1. If not set, then 0.\n\nExample: /task?depth=2"
          in: query
          schema:
          type: number
          default: 0
        - name: expand
          description: "The expand query parameter is used to narrow down (filter) expanding of the referenced entities.\n\nIf expand is not specified, then by default all the fields are expanded.\n\nIf the expand parameter is specified, only that field is expanded according to depth parameter.\n\nExample: /task?expand=resourceSpecification"
          in: query
          schema:
          type: string
        - name: limit
          description: "The limit query parameter will return the number of results you specify\n\nExample: /task?limit=10"
          in: query
          schema:
          type: number
        - name: offset
          description: "The offset query parameter will skip the specified number of results\n\nExample: /task?limit=10&offset=10"
          in: query
          schema:
          type: number
        - name: fields
          description: "Allows to pick which fields to include in the result.\n\nExample: /task?fields=name,description"
          in: query
          schema:
          type: string
        - name: sort
          description: "Sort result based on given field(s).\n\nDefault sort direction is ascending. Use '-' modifier in front of the sort field name to change direction to descending.\n\nExample: /task?sort=name,-lastUpdate,-validFor.startDateTime"
          in: query
          schema:
          type: string
        - name: equality
          description: "All fields that are not special query parameters are compare directly for equality.\n\nEquality comparison can be done for all fields in depth 0 or 1.\nFor depths greater than 0 dot notation is used for field names.\n\nExamples:\n/task?relatedParty.name=MyCompany"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: q
          description: "Performs a text search on the content of the name fields.\n\nExample: /task?q=mobile"
          in: query
          schema:
          type: string
        - name: .lt
          description: "Matches values that are less than a specified value.\n\nExamples:\n/task?lastUpdate.lt=2019-01-01T00:00:20.000Z\n/task?validFor.startDateTime.lt=2019-01-01T00:00:20.000Z&validFor.endDateTime.lt=2022-12-31T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: .lte
          description: "Matches values that are less than or equal to a specified value.\n\nExamples:\n/task?lastUpdate.lte=2019-01-01T00:00:20.000Z\n/task?validFor.startDateTime.lte=2019-01-01T00:00:20.000Z&validFor.endDateTime.lte=2022-12-31T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: .gt
          description: "Matches values that are greater than a specified value.\n\nExamples:\n/task?lastUpdate.gt=2019-01-01T00:00:20.000Z\n/task?validFor.startDateTime.gt=2019-01-01T00:00:20.000Z&validFor.endDateTime.gt=2022-12-31T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
        - name: .gte
          description: "Matches values that are greater than or equal to a specified value.\n\nExamples:\n/task?lastUpdate.gte=2019-01-01T00:00:20.000Z\n/task?validFor.startDateTime.gte=2019-01-01T00:00:20.000Z&validFor.endDateTime.gte=2022-12-31T00:00:20.000Z"
          in: query
          schema:
          oneOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
      responses:
        "200":
          description: Success
          headers:
            "X-Total-Count":
              description: Total number of tasks available.
              schema:
                type: integer
          content:
            "application/json":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/task"
      description: Retrieves a list of all tasks.
      summary: ""
      tags:
- Task
      security:
- Bearer: []
    post:
      parameters: []
      responses:
        "201":
          description: created
