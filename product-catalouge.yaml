  "/vz/qualification":
    get:
      parameters:
- name: relatedParty
          in: query
          required: true
          schema:
          type: string
          description: Brand / MVNO name
        - name: channel
          in: query
          required: true
          schema:
          type: string
          description: Channel name (e.g. WEB, AURA-CARE, RTR, APP)
        - name: partyId
          in: query
          required: false
          schema:
          type: string
          description: Party identifier (RTR variant support)
        - name: deviceType
          in: query
          required: true
          schema:
          type: string
        - name: deviceStatus
          in: query
          required: true
          schema:
          type: string
          description: Device status (ACTIVE / INACTIVE etc.)
        - name: q.code
          in: query
          required: false
          schema:
          type: string
          description: Plan part number (current plan)
        - name: code
          in: query
          required: false
          schema:
          type: string
          description: Plan part number (alternative format)
        - name: depth
          in: query
          required: false
          schema:
          type: integer
          default: 1
          description: Depth for nested data
        - name: prodOfferCategory
          in: query
          required: false
          schema:
          type: string
          description: Product offering category filter
        - name: prodOfferSubCategory
          in: query
          required: false
          schema:
          type: string
          description: Product offering sub-category filter
        - name: fields
          in: query
          required: false
          schema:
          type: string
          description: Comma-separated field projection
        - name: sort
          in: query
          required: false
          schema:
          type: string
          description: "Order the qualified offerings by the given field(s).\n\nComma-separated. Ascending by default; prefix a key with '-' for descending.\n\nSupported keys, matching /v1/product-offering: 'price', 'price:<@type>' (e.g. price:OfferPrice), 'brand', or any document field. 'price' is matched case-sensitively, 'brand' case-insensitively.\n\n**Offerings with no value for the sort key** are kept and placed at the end of the list, so a sort never removes a qualified offering. Pass `excludeUnsorted=true` to omit them instead.\n\n- `price` — always has a value; an offering with no usable price resolves to 0 and sorts first ascending.\n- `price:<@type>` — kept, placed last.\n- any document field — kept, placed last.\n- `brand` — offerings with no brand are kept and placed last.\n\nOrdering is performed by MongoDB. If it cannot be applied the offerings are returned in their natural order and `result.sortWarnings` explains why.\n\nExample: /vz/qualification?sort=-price,name"
        - name: excludeUnsorted
          in: query
          required: false
          schema:
          type: boolean
          description: "Should be used with the sort query parameter.\n\nWhen **true**, offerings that don't have the sort field are **excluded** rather than placed at the end of the list.\n\nHas no effect on `price`, which always resolves to a value. See the `sort` parameter."
        - name: $limit
          in: query
          required: false
          schema:
          type: integer
          description: Max offerings to return
        - name: $skip
          in: query
          required: false
          schema:
          type: integer
          default: 0
          description: Number of offerings to skip
      responses:
        "200":
          description: Qualification response
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/vz-qualification-response"
      description: GET /vz/qualification
      summary: ""
      tags:
- VZ Qualification
      security:
- Bearer: []
