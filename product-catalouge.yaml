        - name: limit
          description: "The limit query parameter will return the number of results you specify\n\nExample: /policyConstraint?limit=10"
          in: query
          schema:
          type: number
        - name: offset
          description: "The offset query parameter will skip the specified number of results\n\nExample: /policyConstraint?limit=10&offset=10"
          in: query
          schema:
          type: number
        - name: fields
          description: "Allows to pick which fields to include in the result.\n\nExample: /policyConstraint?fields=@type,criteriaGroup"
          in: query
