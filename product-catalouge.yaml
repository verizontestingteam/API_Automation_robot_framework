info:
  title: Product Catalog
  description: "Implements TM Forum API: TMF620_ProductCatalog"
  version: "1.0.8"
components:
  schemas:
    "entity-ref":
      title: EntityRef
      description: Reference to an entity
      properties:
        id:
          type: string
          description: Unique identifier of the referenced entity
        href:
          type: string
          description: Hyperlink to access the referenced entity
        name:
          type: string
          description: Name of the referenced entity
        role:
          type: string
          description: Role of the entity (when applicable)
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for disambiguation
        "@schemaLocation":
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
    "product-offering-ref":
      title: ProductOfferingRef
      description: Reference to a product offering (used to avoid circular references)
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        code:
          type: string
        additionalCode:
          type: array
          items:
            type: string
        glCode:
          type: string
        externalLinks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              link:
                type: string
                format: uri
        address:
          type: array
          items:
            type: string
        externalSystem:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              system:
                type: string
              channel:
                type: array
                items:
                  type: string
              "@type":
                type: string
              "@baseType":
                type: string
              additionalAttributes:
                type: object
                additionalProperties:
                  type: object
        name:
          type: string
        seoName:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        localization:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        isBundle:
          type: boolean
        priceApplicability:
          type: string
          enum:
- Convergent
            - NonConvergent
            - Hybrid
        lastUpdate:
          type: string
          format: date-time
        lifecycleStatus:
          type: string
          enum:
- Initial
            - In study
            - In design
            - In test
            - In progress
            - Active
            - Launched
            - Rejected
            - Retired
            - Obsolete
        pendingLifecycleStatus:
          type: string
        pendingApproval:
          type: array
          items:
            type: string
        businessType:
          type: array
          items:
            type: string
        validFor:
          type: object
          properties:
            startDateTime:
              type: string
              format: date-time
            endDateTime:
              type: string
              format: date-time
        version:
          type: string
        "@type":
          type: string
        "@baseType":
          type: string
        "@schemaLocation":
          type: string
        isSellable:
          type: boolean
        isServiceAction:
          type: boolean
        place:
          type: array
          items:
            type: string
        category:
          type: array
          items:
            type: string
        agreement:
          type: array
          items:
            type: string
        marketSegment:
          type: array
          items:
            type: string
        channel:
          type: array
          items:
            type: string
        attachment:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              url:
                type: string
              attachmentType:
                type: string
              mimeType:
                type: string
              "@type":
                type: string
              "@baseType":
                type: string
        additionalAttributes:
          type: object
          additionalProperties:
            type: object
        allowedProductAction:
          type: object
          properties:
            channels:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  allowedActionType:
                    type: array
                    items:
                      type: string
        serviceLevelAgreement:
          type: array
          items:
            type: object
            description: Service Level Agreement reference
            properties:
              id:
                type: string
              name:
                type: string
              version:
                type: string
              "@schemaLocation":
                type: string
              href:
                type: string
              "@referredType":
                type: string
        serviceCandidate:
          description: Identifier for service Candidate
          type: string
        resourceCandidate:
          description: Identifier for Resource Candidate
          type: string
        relatedParty:
          type: array
          items:
            "$ref": "#/components/schemas/entity-ref"
        constraint:
          type: array
          items:
            type: string
        allowedRole:
          type: array
          items:
            type: string
          default: []
        customerCategory:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              subCategory:
                type: array
                items:
                  type: object
        metadata:
          type: object
          additionalProperties:
            type: object
        termActions:
          type: array
          items:
            type: object
        info:
          type: array
          items:
            type: object
        productOfferAction:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              constraintId:
                description: Identifier for Constraint
                type: string
              actionSubtype:
                type: string
        sellLimit:
          type: object
          properties:
            value:
              type: integer
        tags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              channel:
                type: array
                items:
                  type: string
        isOlderVersion:
          type: boolean
          default: false
        createdUser:
          type: string
        updatedUser:
          type: string
    channel:
      title: Channel
      description: Channel database.
      properties:
        id:
          type: string
          description: Unique identifier of the referenced entity
        href:
          type: string
          description: Hyperlink to access the referenced entity
        name:
          type: string
          description: Name of the referenced entity
        role:
          type: string
          description: Role of the entity (when applicable)
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for disambiguation
        "@schemaLocation":
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        additionalAttributes:
          type: object
          description: Additional attributes for the channel (e.g., partyId, partyName)
          additionalProperties: true
    "market-segment":
      title: MarketSegment
      description: MarketSegment database.
      properties:
        id:
          type: string
          description: The identifier of the MarketSegment
        href:
          type: string
        name:
          type: string
        "@referredType":
          type: string
        characteristics: {}
    features:
      title: Features
      description: Feature definition from utility-services
      required:
- name
      properties:
        id:
          type: string
          description: Unique identifier of the feature
        name:
          type: string
        "@type":
          type: string
          default: Characteristic
        valueType:
          type: string
          default: object
        type:
          type: string
        code:
          type: string
        value:
          type: object
          properties:
            featureType:
              type: string
            toggleFlag:
              type: string
            notes:
              type: string
            restrictSuiFlag:
              type: string
            displaySuiFlag:
              type: string
            requirement:
              type: string
            featureRequirement:
              type: string
            featureValue:
              type: string
            mtasCode:
              type: string
            isLCC:
              type: string
            unitOfMeasure:
              type: string
            bucketType:
              type: string
            bucketGroup:
              type: string
            activeFlag:
              type: string
            bucketRequirement:
              type: string
            autoRenewFlag:
              type: string
            autoRenewFrequency:
              type: string
            autoRenewValue:
              type: string
            autoRenewDay:
              type: string
            benefitType:
              type: string
            bucketValue:
              type: string
            benefitValue:
              type: string
            suiDisplayType:
              type: string
            hideUbiFlag:
              type: string
            baseBundle:
              type: string
    "service-specification":
      title: ServiceSpecification
      description: ServiceSpecification database.
      required:
- name
      properties:
        id:
          type: string
        href:
          type: string
        description:
          type: string
        code:
          type: string
        isBundle:
          type: boolean
        lastUpdate:
          type: string
          format: date-time
        lifecycleStatus:
          type: string
          enum:
- Initial
            - In study
            - In design
            - In test
            - In progress
            - Active
            - Launched
            - Rejected
            - Retired
            - Obsolete
        pendingLifecycleStatus:
          type: string
        pendingApproval:
          type: array
          items:
            type: string
        name:
          type: string
        version: {}
        additionalAttributes:
          type: object
        validFor:
          type: object
          properties:
            startDateTime:
              type: string
              format: date-time
            endDateTime:
              type: string
              format: date-time
        "@baseType":
          type: string
        "@schemaLocation":
          type: string
        "@type":
          type: string
        category:
          type: array
          items:
            "$ref": "#/components/schemas/service-category"
        attachment:
          type: array
          items:
            "$ref": "#/components/schemas/entity-ref"
        bundledServiceSpecification:
          type: array
          items:
            "$ref": "#/components/schemas/service-specification"
        resourceSpecification:
          type: array
          items:
            description: Identifier for ResourceSpecification
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              code:
                type: string
              isBundle:
                type: boolean
              lifecycleStatus:
                type: string
                enum:
- Initial
                  - In study
                  - In design
                  - In test
                  - Active
                  - Launched
                  - Rejected
                  - Retired
                  - Obsolete
              version:
                type: string
              "@type":
                type: string
              "@baseType":
                type: string
              "@schemaLocation":
                type: string
              model:
                type: string
              part:
                type: string
              sku:
                type: string
              externalSystem:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    system:
                      type: string
                    "@type":
                      type: string
                    "@baseType":
                      type: string
                    additionalAttributes:
                      type: object
                      additionalProperties:
                        type: object
        resourceFacingServiceSpecification:
          type: array
          items:
            "$ref": "#/components/schemas/service-specification"
        serviceLevelSpecification:
          type: array
          items:
            "$ref": "#/components/schemas/entity-ref"
        featureSpecification:
          type: array
          items:
            "$ref": "#/components/schemas/feature-specification"
        serviceSpecRelationship:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              href:
                type: string
              name:
                type: string
              relationshipType:
                type: string
              role:
                type: string
              validFor:
                type: object
                properties:
                  startDateTime:
                    type: string
                    format: date-time
                  endDateTime:
                    type: string
                    format: date-time
              "@baseType":
                type: string
              "@schemaLocation":
                type: string
              "@type":
                type: string
              "@referredType":
                type: string
        relatedParty:
          type: array
          items:
            "$ref": "#/components/schemas/entity-ref"
        serviceSpecCharacteristic:
          type: array
          items:
            type: object
            properties:
              configurable:
                type: boolean
              description:
                type: string
              extensible:
                type: boolean
              isUnique:
                type: boolean
              maxCardinality:
                type: number
              minCardinality:
                type: number
              name:
                type: string
              regex:
                type: string
              valueType:
                type: string
              validFor:
                type: object
                properties:
                  startDateTime:
                    type: string
                    format: date-time
                  endDateTime:
                    type: string
                    format: date-time
              "@baseType":
                type: string
              "@schemaLocation":
                type: string
              "@type":
                type: string
              "@valueSchemaLocation":
                type: string
              serviceSpecCharRelationship:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    href:
                      type: string
                    name:
                      type: string
                    relationshipType:
                      type: string
                    role:
                      type: string
                    validFor:
                      type: object
                      properties:
                        startDateTime:
                          type: string
                          format: date-time
                        endDateTime:
                          type: string
                          format: date-time
                    "@baseType":
                      type: string
                    "@schemaLocation":
                      type: string
                    "@type":
                      type: string
              serviceSpecCharacteristicValue:
                type: array
                items:
                  type: object
                  properties:
                    "@type":
                      type: string
                    valueType:
                      type: string
                    value: {}
                    isDefault:
                      type: boolean
                    unitOfMeasure:
                      type: string
                    valueFrom:
                      type: integer
                    valueTo:
                      type: integer
                    rangeInterval:
                      type: string
                      nullable: true
                    regex:
                      type: string
                    additionalAttributes:
                      type: object
        externalSystemCapability:
          "$ref": "#/components/schemas/external-system-capability"
    "service-category":
      title: ServiceCategory
      description: ServiceCategory database.
      required:
- name
        - lifecycleStatus
      properties:
        href:
          type: string
        description:
          type: string
        code:
          type: string
        lastUpdate:
          type: string
          format: date-time
        lifecycleStatus:
          type: string
          enum:
- Initial
            - In study
            - In design
            - In test
            - In progress
            - Active
            - Launched
            - Rejected
            - Retired
            - Obsolete
        pendingLifecycleStatus:
          type: string
        name:
          type: string
        version: {}
        validFor:
          type: object
          properties:
            startDateTime:
              type: string
              format: date-time
            endDateTime:
              type: string
              format: date-time
        "@baseType":
          type: string
        "@schemaLocation":
          type: string
        "@type":
          type: string
        category:
          type: array
          items:
            "$ref": "#/components/schemas/service-category"
    "feature-specification":
      title: FeatureSpecification
      description: FeatureSpecification database.
      required:
- name
      properties:
        name:
          type: string
        description:
          type: string
        code:
          type: string
        href:
          type: string
        version:
          type: string
        lastUpdate:
          type: string
          format: date-time
        lifecycleStatus:
          type: string
          enum:
- Initial
            - In test
            - Active
            - Launched
            - Retired
            - Obsolete
          default: Initial
        requirement:
          type: string
          enum:
- Add
            - Optional
          default: Add
          description: Indicates if this feature is required or optional
        category:
          type: string
          description: Category for grouping feature specifications
        additionalAttributes:
          type: object
        "@type":
          type: string
        policyConstraint:
          type: array
          items:
            "$ref": "#/components/schemas/policyConstraint"
        featureSpecificationCharacteristic:
          type: array
          items:
            "$ref": "#/components/schemas/features"
    "external-system-capability":
      title: ExternalSystemCapability
      description: ExternalSystemCapability database.
      required:
- name
      properties:
        id:
          type: string
          description: The identifier of the ExternalSystemCapability
        href:
          type: string
        name:
          type: string
        description:
          type: string
        "@schemaLocation":
          type: string
        systemID:
          type: string
        capabilityType:
          type: string
        validFor:
          type: object
          properties:
            startDateTime:
              type: string
              format: date-time
            endDateTime:
              type: string
              format: date-time
        version:
          type: string
        flow:
          type: string
          enum:
- DOMPolicyFlows
            - ExternalFlows
            - PartnerFlows
        passthroughOrder:
          type: boolean
        fulfillmentCapabilitySpecification:
          type: array
          items:
            "$ref": "#/components/schemas/fulfillment-capability-specification"
    "fulfillment-capability-specification":
      title: FulfillmentCapabilitySpecification
      description: FulfillmentCapabilitySpecification database.
      properties:
        id:
          type: string
          description: The identifier of the FulfillmentCapabilitySpecification
        href:
          type: string
        name:
          type: string
        description:
          type: string
        "@schemaLocation":
          type: string
        fulfillmentType:
          type: string
        fulfillmentID:
          type: string
        fulfillmentVersion:
          type: string
        fulfillmentTemplates:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              tenant:
                type: string
              url:
                type: string
              inputParams:
                type: array
                items: {}
              outputParams:
                type: array
                items: {}
    task:
      title: Task
      description: Task database.
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        description:
          type: string
        sla:
          type: object
          description: Service Level Agreement reference
          properties:
            id:
              type: string
            name:
              type: string
            version:
              type: string
            "@schemaLocation":
              type: string
            href:
              type: string
            "@type":
              type: string
        appointmentRequired:
          type: boolean
        relatedParty:
          type: array
          items:
            "$ref": "#/components/schemas/entity-ref"
        resourceSpecCharValueUse:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              valueType:
                type: string
              minCardinality:
                type: integer
              maxCardinality:
                type: integer
              validFor:
                type: object
                properties:
                  startDateTime:
                    type: string
                    format: date-time
                  endDateTime:
                    type: string
                    format: date-time
              resourceSpecification:
                type: object
                description: Resource Specification reference
                properties:
                  id:
                    type: string
                  href:
                    type: string
                  name:
                    type: string
                  version:
                    type: string
                  "@referredType":
                    type: string
                  "@type":
                    type: string
              resourceSpecCharacteristicValue:
                type: array
                items:
                  type: object
    place:
      title: Place
      description: Place database.
      required:
- name
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        "@type":
          type: string
        "@baseType":
          type: string
        "@referredType":
          type: string
        "@schemaLocation":
          type: string
        address:
          type: array
          items:
            "$ref": "#/components/schemas/address"
        geographicSite:
          type: array
          items:
            type: object
            description: Geographic site reference
            properties:
              id:
                type: string
              name:
                type: string
              href:
                type: string
                format: uri
              "@type":
                type: string
              "@schemaLocation":
                type: string
                format: uri
        geographicLocation:
          type: array
          items:
            type: object
            description: Geographic location reference
            properties:
              id:
                type: string
              name:
                type: string
              href:
                type: string
              "@type":
                type: string
              "@schemaLocation":
                type: string
    address:
      title: Address
      description: Schema for geographic address data
      properties:
        id:
          type: string
          description: The identifier of the Address
        href:
          type: string
        streetNr:
          type: string
        streetName:
          type: string
        streetType:
          type: string
        postcode:
          type: string
        locality:
          type: string
          nullable: true
        city:
          type: string
        stateOrProvince:
          type: string
          nullable: true
        country:
          type: string
        "@type":
          type: string
        "@schemaLocation":
          type: string
          format: uri
        shopcodes:
          type: array
          items:
            type: string
        geographicLocation:
          type: array
          items:
            type: object
            description: Geographic location reference
            properties:
              id:
                type: string
              name:
                type: string
              href:
                type: string
              "@type":
                type: string
              "@schemaLocation":
                type: string
        geographicSubAddress:
          type: array
          items:
            type: object
            description: Geographic sub-address reference
            properties:
              id:
                type: string
              href:
                type: string
              "@type":
                type: string
              "@schemaLocation":
                type: string
    "product-catalog":
      title: ProductCatalog
      description: ProductCatalog database.
      required:
- name
        - lifecycleStatus
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        description:
          type: string
        code:
          type: string
        lifecycleStatus:
          type: string
          enum:
- Initial
            - In study
            - In design
            - In test
            - Active
            - Launched
            - Rejected
            - Retired
            - Obsolete
        pendingLifecycleStatus:
          type: string
        lastUpdate:
          type: string
          format: date-time
        validFor:
          type: object
          properties:
            startDateTime:
              type: string
              format: date-time
            endDateTime:
              type: string
              format: date-time
        version:
          type: string
        type:
          type: string
          default: ProductCatalog
        "@type":
          type: string
        "@baseType":
          type: string
        "@schemaLocation":
          type: string
        category:
          type: array
          items:
            "$ref": "#/components/schemas/product-category"
        relatedParty:
          type: array
          items:
            "$ref": "#/components/schemas/entity-ref"
    "product-category":
      title: ProductCategory
      description: ProductCategory database.
      required:
- name
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        description:
          type: string
        code:
          type: string
        "@type":
          type: string
          default: Category
        "@baseType":
          type: string
        "@schemaLocation":
          type: string
        lastUpdate:
          type: string
          format: date-time
        lifecycleStatus:
          type: string
          enum:
- Initial
            - In study
            - In design
            - In test
            - Active
            - Launched
            - Rejected
            - Retired
            - Obsolete
          default: Active
        pendingLifecycleStatus:
          type: string
        validFor:
          type: object
          properties:
            startDateTime:
              type: string
              format: date-time
            endDateTime:
              type: string
              format: date-time
        version:
          type: string
        parentId:
          type: string
        isRoot:
          type: boolean
          default: true
        subCategory:
          type: array
          items:
            "$ref": "#/components/schemas/product-category"
        productOffering:
          type: array
          items:
            "$ref": "#/components/schemas/product-offering"
        relationship:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The identifier of the Relationship
              name:
                type: string
              href:
                type: string
              type:
                type: string
              lifecycleStatus:
                type: string
              version:
                type: string
              minCardinality:
                type: number
              maxCardinality:
                type: number
              "@type":
                type: string
        relatedParty:
          type: array
          items:
            "$ref": "#/components/schemas/entity-ref"
    Facet:
      type: object
      properties:
        category:
          type: string
          description: Facet group name (not included when the list itself is filtered by category)
        attribute:
          type: string
        value:
          type: string
        subFilterSummary:
          type: array
          items:
            type: object
            properties:
              attribute:
                type: string
              value:
                type: string
              count:
                type: integer
    "product-offering":
      title: ProductOffering
      description: ProductOffering database.
      required:
- name
